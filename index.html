<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SKY STRIKERS 1945</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>
  <div id="boot-msg">LOADING…</div>

  <!-- 랭킹 닉네임 입력창 (게임 위에 HTML로 띄움) -->
  <div id="name-modal" class="hidden">
    <div class="nm-box">
      <div class="nm-title">RANKING</div>
      <div class="nm-score" id="nm-score"></div>
      <input id="nm-input" type="text" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="nm-msg" id="nm-msg"></div>
      <div class="nm-row">
        <button id="nm-cancel" class="nm-btn nm-sub" type="button">취소</button>
        <button id="nm-ok" class="nm-btn" type="button">등록</button>
      </div>
    </div>
  </div>

  <!-- Phaser 3 게임 엔진 (CDN). 오프라인에서 쓰려면 phaser.min.js를 받아 같은 폴더에 두고 src만 바꾸면 됩니다. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
