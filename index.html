<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SKY STRIKERS 1945 - 추억의 오락실 비행기 슈팅</title>
  <meta name="description" content="추억의 오락실 비행기 슈팅을 폰으로! 5 스테이지 · 전투기 4종 · 인터넷 없이도 플레이">

  <!-- 카톡·SNS 링크 미리보기 카드 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SKY STRIKERS 1945">
  <meta property="og:title" content="SKY STRIKERS 1945 - 추억의 오락실 비행기 슈팅">
  <meta property="og:description" content="폰으로 즐기는 1945 스타일 슈팅! 5 스테이지 · 전투기 4종 · 보스전 · 인터넷 없이도 플레이">
  <meta property="og:url" content="https://younguk06-sonny.github.io/sky-strikers-1945/">
  <meta property="og:image" content="https://younguk06-sonny.github.io/sky-strikers-1945/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SKY STRIKERS 1945 - 전투기가 적기를 격추하는 장면">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 홈 화면 아이콘 · 앱 정보 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="1945">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202611200940">
</head>
<body>
  <div id="game"></div>
  <div id="boot-msg">LOADING…</div>

  <!-- 랭킹 닉네임 입력창 (게임 위에 HTML로 띄움) -->
  <div id="name-modal" class="hidden">
    <div class="nm-box">
      <div class="nm-title">RANKING</div>
      <div class="nm-score" id="nm-score"></div>
      <input id="nm-input" type="text" maxlength="12" placeholder="닉네임 (최대 12자)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="nm-msg" id="nm-msg"></div>
      <div class="nm-row">
        <button id="nm-cancel" class="nm-btn nm-sub" type="button">취소</button>
        <button id="nm-ok" class="nm-btn" type="button">등록</button>
      </div>
    </div>
  </div>

  <!-- 뒤로가기 종료 확인창 -->
  <div id="exit-modal" class="hidden">
    <div class="nm-box">
      <div class="nm-title ex-title">게임을 종료할까요?</div>
      <div class="nm-msg ex-msg">진행 중인 게임은 저장되지 않아요</div>
      <div class="nm-row">
        <button id="ex-no" class="nm-btn nm-sub" type="button">계속하기</button>
        <button id="ex-yes" class="nm-btn" type="button">종료</button>
      </div>
    </div>
  </div>

  <!-- Phaser 3 게임 엔진 (같은 폴더에 내장 — 인터넷 없이 동작) -->
  <script src="phaser.min.js"></script>
  <script src="game.js?v=202611200940"></script>
  <script>
    // 휴대폰 뒤로가기 → 종료 확인창
    (function () {
      var modal = document.getElementById('exit-modal');
      var leaving = false;
      function guard() { history.pushState({ ssGuard: 1 }, ''); }
      function isOpen() { return !modal.classList.contains('hidden'); }
      function pauseGame() {
        try {
          var g = window.__ssGame;
          var gs = g && g.scene.getScene('Game');
          if (gs && gs.sys.isActive() && gs.openPause) gs.openPause();
        } catch (e) { /* 무시 */ }
      }
      // 크롬은 사용자가 화면을 한 번 만진 뒤에 넣은 기록만 뒤로가기에서 멈춰 준다
      var armed = false;
      function arm() {
        if (armed) return;
        armed = true;
        guard();
        window.removeEventListener('pointerdown', arm, true);
        window.removeEventListener('keydown', arm, true);
      }
      window.addEventListener('pointerdown', arm, true);
      window.addEventListener('keydown', arm, true);
      window.addEventListener('popstate', function () {
        if (leaving) return;
        guard();
        var nm = document.getElementById('name-modal');
        if (nm && !nm.classList.contains('hidden')) { document.getElementById('nm-cancel').click(); return; }
        if (isOpen()) { modal.classList.add('hidden'); return; }
        pauseGame();
        modal.classList.remove('hidden');
      });
      document.getElementById('ex-no').onclick = function () { modal.classList.add('hidden'); };
      document.getElementById('ex-yes').onclick = function () {
        leaving = true;
        modal.classList.add('hidden');
        try { window.close(); } catch (e) { /* 무시 */ }
        history.go(-2);
      };
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
